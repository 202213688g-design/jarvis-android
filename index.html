<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061321"><meta name="description" content="JARVIS asistente móvil de voz"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>JARVIS Móvil</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#d7faff;background:#061321}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 28%,#0b3850 0%,#061321 55%);display:flex;align-items:center;justify-content:center;padding:22px}.app{width:min(100%,520px)}header{display:flex;justify-content:space-between;align-items:center;color:#8edbe7;letter-spacing:.2em;font-size:.8rem}.status{font-size:.7rem;letter-spacing:0;color:#74dfb8}.core{width:220px;height:220px;margin:42px auto 28px;border:2px solid #21c6ec;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 22px #15b7e755,inset 0 0 35px #0db1d533;position:relative}.core:before,.core:after{content:"";position:absolute;border:1px dashed #29c9e8;border-radius:50%;inset:13px}.core:after{inset:32px;border-style:solid;border-color:#1696b9}.core strong{font-size:2.5rem;letter-spacing:.14em;text-shadow:0 0 14px #1ce5ff;z-index:1}.intro{text-align:center;color:#b0d8e0;margin-bottom:25px}.panel{border:1px solid #1b5b72;background:#071e2ddd;border-radius:16px;padding:17px;min-height:130px;max-height:270px;overflow:auto;line-height:1.5}.panel p{margin:.3rem 0 .8rem}.panel b{color:#3dd8f6}.controls{display:flex;gap:10px;margin-top:14px}input{flex:1;min-width:0;background:#081f30;color:#e5fbff;border:1px solid #26708a;border-radius:12px;padding:13px;font-size:1rem}button{background:#0e6c89;border:1px solid #2ecbf0;color:white;border-radius:12px;padding:12px 16px;font-size:1rem;cursor:pointer}button:disabled{opacity:.4}.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1}.hint{font-size:.77rem;color:#87aab7;text-align:center;margin-top:20px}label{font-size:.85rem;color:#b6e5ef}button:focus-visible,input:focus-visible{outline:3px solid #6ff5ff}
</style></head><body><main class="app"><header><span>JARVIS / MOBILE</span><span class="status" id="status">● LISTO</span></header><div class="core" aria-hidden="true"><strong>J</strong></div><p class="intro">Asistente personal · Español</p><section class="panel" id="log" aria-live="polite"><p><b>JARVIS:</b> Sistemas iniciados. ¿En qué puedo ayudarte?</p></section><form class="controls" id="form"><input id="command" aria-label="Escribe tu comando" placeholder="Escribe un comando..." autocomplete="off"><button type="submit">Enviar</button></form><div class="actions"><button id="mic" type="button">🎙 Hablar</button><button id="sound" type="button" aria-pressed="true">🔊 Voz activa</button></div><p class="hint">Comandos: hola, hora, fecha, abre YouTube, busca [tema], ayuda. Las búsquedas abren el navegador. Funciona sin IA externa.</p></main><script>
const $=id=>document.getElementById(id), log=$('log');let voice=true;
function add(who,message){const p=document.createElement('p'),b=document.createElement('b');b.textContent=who+': ';p.append(b,document.createTextNode(message));log.append(p);log.scrollTop=log.scrollHeight}
function say(s){if(!voice||!('speechSynthesis' in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='es-PE';u.rate=.98;speechSynthesis.speak(u)}
function execute(raw){const q=raw.trim();if(!q)return;add('TÚ',q);const t=q.toLocaleLowerCase('es');let r='Todavía no sé hacer eso. Di «ayuda» para ver mis comandos.';let url=null;
if(/\b(hola|buenos días|buenas tardes|buenas noches)\b/.test(t))r='Hola. Soy JARVIS, tu asistente móvil.';
else if(t.includes('hora'))r='Son las '+new Intl.DateTimeFormat('es-PE',{hour:'2-digit',minute:'2-digit'}).format(new Date())+'.';
else if(t.includes('fecha')||t.includes('qué día'))r='Hoy es '+new Intl.DateTimeFormat('es-PE',{dateStyle:'full'}).format(new Date())+'.';
else if(t.includes('ayuda'))r='Puedo decirte la hora, la fecha, abrir YouTube o Google y buscar información en la web.';
else if(t.includes('abre youtube')){r='Abriendo YouTube.';url='https://www.youtube.com'}
else if(t.includes('abre google')){r='Abriendo Google.';url='https://www.google.com'}
else if(t.startsWith('busca ')||t.startsWith('buscar ')){const term=q.replace(/^buscar?\s+/i,'').trim();if(term){r='Buscando '+term+'.';url='https://www.google.com/search?q='+encodeURIComponent(term)}}
add('JARVIS',r);say(r);if(url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Abrir resultado';const p=document.createElement('p');p.append(a);log.append(p); /* User gesture navigation may be blocked on some browsers */ window.open(url,'_blank','noopener,noreferrer')}}
$('form').addEventListener('submit',e=>{e.preventDefault();execute($('command').value);$('command').value=''});
$('sound').addEventListener('click',()=>{voice=!voice;$('sound').textContent=voice?'🔊 Voz activa':'🔇 Voz apagada';$('sound').setAttribute('aria-pressed',String(voice));if(!voice&&'speechSynthesis'in window)speechSynthesis.cancel()});
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){$('mic').disabled=true;$('mic').textContent='Micrófono no disponible'}else{$('mic').addEventListener('click',()=>{try{const rec=new Recognition();rec.lang='es-PE';rec.interimResults=false;rec.onstart=()=>{$('status').textContent='● ESCUCHANDO'};rec.onend=()=>{$('status').textContent='● LISTO'};rec.onerror=()=>{add('JARVIS','No pude usar el micrófono. Comprueba los permisos del navegador.')};rec.onresult=e=>execute(e.results[0][0].transcript);rec.start()}catch{add('JARVIS','No se pudo iniciar el micrófono.')}})}
if('serviceWorker'in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
